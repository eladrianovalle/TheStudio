name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          # Runtime dep for the tomli fallback path (harmless on 3.11+).
          pip install "tomli>=2.0; python_version < '3.11'"

      # ruff is the same static-check gate impl_loop.py ships as the default
      # for consumers, so we run it on ourselves here.
      - name: Ruff
        run: ruff check .

      - name: Tests
        run: python -m pytest tests/ -q

      # The writer/editor prompt shells live in .claude/workflows/*.js, and their
      # tests are the only thing that catches a prompt losing its mandate — no
      # Python test loads that file. Without this step a change to the loop can
      # break all of them and still show green (issue #136). Node ships on the
      # runner and these use only node:test/node:assert, so there is nothing to
      # install. Named explicitly rather than passing the directory: `node --test`
      # on tests/ tries to run the fixtures/ subdir and fails.
      - name: Workflow shell tests
        working-directory: .
        run: node --test .claude/workflows/tests/workflow-shells.test.mjs
