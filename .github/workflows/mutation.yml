name: Mutation testing

# Mutation testing is slow (it re-runs the suite once per mutant), so it does not
# gate every PR. It runs weekly and on demand. Surviving mutants are a signal
# that the assertions for that code have a gap — review them and strengthen the
# test, per studio/docs/AI_TDD_METHODOLOGY.md.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC

jobs:
  mutmut:
    name: mutmut
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mutation tests
        # Config (paths + runner) lives in setup.cfg. Don't fail the job on
        # survivors — the results below are the report to act on.
        run: mutmut run || true

      - name: Show results
        run: mutmut results
