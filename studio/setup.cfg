# Mutation-testing config for mutmut (>=2.5,<3).
#
# AI-TDD (studio/docs/AI_TDD_METHODOLOGY.md) treats mutation testing as the check
# that the *assertions* have teeth: a passing suite that survives mutants is a
# suite that isn't really testing behavior. The implementation loop's
# `require_mutation_check` gate points at this tool.
#
# Scope: the pure-logic modules (deterministic, no I/O) where mutation scores are
# meaningful and fast. Run the whole thing with:  mutmut run
# Or target one file:  mutmut run --paths-to-mutate stats.py
# Then inspect survivors: mutmut results  /  mutmut show <id>
[mutmut]
paths_to_mutate=verdict.py,config_loading.py,decision_points.py,scopes.py,stats.py,clarity.py,impl_loop.py,question_mode.py,persona_overrides.py,role_overrides.py
runner=python -m pytest -q -x
tests_dir=tests/
