[project]
name = "studio"
version = "0.1.0"
description = "Studio workflow instruction generator"
authors = [{ name = "Adriano Valle", email = "adriano@orcpunk.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "tomli>=2.0;python_version<'3.11'",
]

[project.optional-dependencies]
# Dev/CI tooling. ruff is the static gate; mutmut backs the AI-TDD mutation
# check that impl_loop's require_mutation_check gate expects (see setup.cfg).
dev = [
    "ruff",
    "pytest",
    "mutmut>=2.5,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 100
# The generated-artifact and cache dirs are not source.
extend-exclude = ["output", "knowledge", ".studio", ".scratch"]

[tool.ruff.lint]
# Default rules (pyflakes + a slice of pycodestyle). This is the same gate
# `impl_loop.py` ships as the default static check for consumers, so we hold
# ourselves to it too.
select = ["E4", "E7", "E9", "F"]
