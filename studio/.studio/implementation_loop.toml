# Studio's own /forge gate commands, written by hand.
#
# It lives under studio/ rather than at the repo root because that is where /forge looks
# in a Studio source checkout: the package directory is this repo's artifact root (see
# impl_loop.project_config_root). The .gitignore takes three lines to let this one file
# through, since the directory around it is ignored.
#
# Nothing is detected any more — a [gate] key left out of this file is empty, not a
# guess — so every command Studio gates itself with is written out here.

[gate]
# The suite runs from the package directory: tests/ import the modules beside them.
test_command = "cd studio && python -m pytest tests/ -q"

# {paths} is replaced with the files the unit touched. Configured in studio/pyproject.toml.
static_checks = ["ruff check {paths}"]

# mutmut reads its scope and runner from studio/setup.cfg, so it has to run from there.
require_mutation_check = true
mutation_command = "cd studio && mutmut run"
